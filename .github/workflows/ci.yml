name: CI/CD Pipeline

on:
  push:
    branches: [main, roblox-game-factory]
  pull_request:
    branches: [main]

env:
  ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Lint with Selene
        run: selene src/

      - name: Format check with StyLua
        run: stylua --check src/

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install Wally packages
        run: wally install

      - name: Run tests with Lune
        run: lune run tests/runner

  build:
    name: Build Game
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install Wally packages
        run: wally install

      - name: Build .rbxl
        run: |
          mkdir -p build
          rojo build default.project.json -o build/game.rbxl

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-build
          path: build/game.rbxl

  deploy:
    name: Deploy to Roblox
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: game-build
          path: build/

      - name: Publish to Roblox
        run: |
          rbxcloud experience publish \
            --api-key "$ROBLOX_API_KEY" \
            --universe-id ${{ vars.UNIVERSE_ID }} \
            --place-id ${{ vars.PLACE_ID }} \
            --version-type published \
            --filename build/game.rbxl
